<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schottland Februar 2027</title>
<meta name="theme-color" content="#0f5c63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schottland">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f1f4f3;--surface:#fff;--ink:#16272b;--muted:#566b6f;--line:#d5dedc;
  --loch:#0f5c63;--heather:#7a4b8f;--rail:#b4541c;--soft:#e3ecea;--ok:#2f7d4f;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1c;--surface:#17262a;--ink:#e6efed;--muted:#9db0b2;--line:#2b3f43;--loch:#5cc0c4;--heather:#c79bd8;--rail:#f0a15f;--soft:#1e3237;--ok:#6fcf97}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--loch)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.7rem,6vw,2.6rem)}
h2{font-size:1.2rem;margin-bottom:10px}
h3{font-size:1.08rem}
p{margin:0 0 6px}
:focus-visible{outline:3px solid var(--heather);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
header.top b{font-size:1rem}
#sync{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
#sync[data-s=ok]{color:var(--ok)}
#sync[data-s=error]{color:var(--rail)}
main{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{padding:6px 2px}
.kicker{color:var(--loch);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted);font-size:.93rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card ul,.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.plain{list-style:none;padding:0}
.progs{display:flex;flex-direction:column;gap:10px}
.prog{display:grid;grid-template-columns:1fr auto;gap:4px;text-decoration:none;color:inherit}
.prog i{grid-column:1/-1;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--loch) var(--p),var(--soft) var(--p))}
ul.next{list-style:none;padding:0}
ul.next li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0}
ul.next li:last-child{border:0}
.due{font-size:.8rem;color:var(--muted);white-space:nowrap}
.due.late{color:var(--rail);font-weight:700}
.plan{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px;align-items:start}
.mapbox{position:sticky;top:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;scroll-margin-top:64px}
.mapbox svg{display:block;width:100%;height:auto;font-family:var(--font)}
.days{display:flex;flex-direction:column;gap:12px}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;scroll-margin-top:64px}
details.day[open]{border-color:var(--loch)}
details.day summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
details.day summary::-webkit-details-marker{display:none}
.daynum{color:var(--loch);font-weight:700;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.friend{background:transparent;border:1px solid var(--heather);color:var(--heather)}
.chip.sun{background:transparent;border:1px solid var(--line);color:var(--muted)}
ol.stops{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:12px}
.stop{display:grid;grid-template-columns:78px 1fr;gap:8px}
.time{color:var(--loch);font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.addr{display:block;color:var(--muted);font-size:.85rem}
.nav{display:flex;gap:8px;margin:6px 0 0 86px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--loch);background:var(--loch);color:#fff;font:inherit;font-size:.95rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--loch)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:.88rem}
@media (prefers-color-scheme:dark){.btn:not(.ghost){color:#0f1a1c}}
ul.tips{margin:8px 0;padding-left:18px;color:var(--muted);font-size:.92rem}
.lbl{display:block;font-size:.85rem;color:var(--muted);margin-top:8px}
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;margin-top:4px}
.book .bhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px}
.book[data-st=gebucht],.book[data-st=bezahlt]{border-left:5px solid var(--ok)}
.book[data-st=entfällt]{opacity:.6}
.seg{display:flex;margin:10px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--loch);color:var(--surface);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fields label,.expform label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
ul.todo{list-style:none;padding:0}
ul.todo li{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
ul.todo label{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer}
ul.todo input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--loch)}
ul.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:2px 8px;min-width:40px;min-height:36px}
.x.armed{color:var(--rail);font-size:.85rem;font-weight:700}
form.add{display:flex;gap:8px;margin-top:10px}
.expform{display:grid;grid-template-columns:2fr 1fr 80px 1fr auto;gap:10px;align-items:end}
@media (max-width:640px){.expform{grid-template-columns:1fr 1fr}.expform label:first-child{grid-column:1/-1}.expform .btn{grid-column:1/-1}}
ul.exp{list-style:none;padding:0}
ul.exp li{display:grid;grid-template-columns:62px 1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
ul.exp small{color:var(--muted)}
.big{font-size:1.25rem;font-weight:700}
.inline{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.inline input{width:80px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:700;border-bottom:0}
.tel{font-weight:700;font-size:1.15rem;margin-right:6px}
details.setup{margin-top:10px}
details.setup summary{cursor:pointer;color:var(--loch);margin-bottom:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--loch)}
@media (max-width:820px){.plan{grid-template-columns:1fr}.mapbox{position:static}.nav{margin-left:0}}
@media print{nav.tabs,header.top,textarea,.nav,.row{display:none}}
</style>
</head>
<body>
<header class="top"><b>Schottland 2027</b><span id="sync" data-s="off">Nur auf diesem Gerät</span></header>
<main id="main"><noscript>Bitte JavaScript aktivieren.</noscript></main>
<nav class="tabs" aria-label="Bereiche">

  <a href="#route"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Route</a>
  <a href="#buchen"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M8 3v4M16 3v4"/></svg>Buchungen</a>
  <a href="#listen"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Listen</a>
  <a href="#geld"><svg viewBox="0 0 24 24"><path d="M17 7a5 5 0 1 0 0 10M5 10h8M5 14h8"/></svg>Geld</a>

</nav>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
