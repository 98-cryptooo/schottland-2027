<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schottland Februar 2027</title>
<meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111a1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schottland">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Design "Winterlicht": Haferpapier, Schiefer, Lochwasser, Heide, Moos, Laternenlicht */
:root{
  color-scheme:light dark;
  --bg:#f3eee5;--surface:#fffcf6;--surface-2:#ece5d8;
  --ink:#1d2a2c;--muted:#5f6a67;--line:#e0d6c6;
  --loch:#1f4d58;--loch-soft:#dfe9e8;--on-loch:#fbf7ef;
  --heather:#8b4f7c;--heather-soft:#f1e2ea;
  --moss:#56703f;--moss-soft:#e3ead6;
  --ember:#b5621f;--ember-soft:#f7e6d3;
  --late:#a8432a;
  --sky-top:#c9d6dc;--sky-bot:#f4e3cd;--sun:#f2b46b;--stars:0;
  --hill-far:#a9a3b8;--hill-mid:#6f7d86;--hill-near:#3d5148;--water:#8fa9b0;--water-line:#c7d6d6;
  --viaduct:#5b524b;--train:#7a2f2a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"Bitstream Charter",Georgia,serif;
  --fs-display:clamp(64px,22vw,92px);--fs-1:32px;--fs-2:23px;--fs-3:19px;
  --fs-body:17px;--fs-s:15px;--fs-xs:13px;--fs-2xs:11px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-s:10px;--r-m:16px;--r-l:24px;--r-pill:999px;
  --sh-1:0 1px 2px rgba(70,50,25,.06),0 6px 18px -10px rgba(70,50,25,.20);
  --sh-2:0 2px 4px rgba(70,50,25,.08),0 18px 36px -18px rgba(70,50,25,.35);
  --sh-btn:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(31,77,88,.55);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111a1c;--surface:#19252a;--surface-2:#22323a;--ink:#ece5d8;--muted:#a3aca8;--line:#2b3b41;
  --loch:#8cc2c9;--loch-soft:#1f3a40;--on-loch:#0d1a1d;
  --heather:#d6a5c8;--heather-soft:#3a2836;--moss:#a9c08a;--moss-soft:#26331f;
  --ember:#f2a95c;--ember-soft:#3b2a1a;--late:#f08a6c;
  --sky-top:#0c1622;--sky-bot:#2a3346;--sun:#e9e2cf;--stars:1;
  --hill-far:#3a3b55;--hill-mid:#27323d;--hill-near:#152226;--water:#1d2b38;--water-line:#3a4d5c;
  --viaduct:#0c1418;--train:#3a1e1c;
  --sh-1:0 1px 0 rgba(255,255,255,.03) inset,0 8px 22px -12px rgba(0,0,0,.7);
  --sh-2:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -18px rgba(0,0,0,.8);
  --sh-btn:0 8px 20px -10px rgba(140,194,201,.45);
}}

/* Basis */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--loch)}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-weight:600}
h1{font-family:var(--serif);font-size:var(--fs-1);letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:var(--fs-2);margin-bottom:var(--s3)}
h3{font-size:var(--fs-3);letter-spacing:-.01em}
p{margin:0 0 var(--s2)}
.kicker{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ember);margin:0 0 var(--s2)}
.kicker.quiet{color:var(--muted)}
.muted{color:var(--muted);font-size:var(--fs-s)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--heather);outline-offset:2px;border-radius:6px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5);padding:var(--s4)}
.pagehead{padding:var(--s2) 2px 0}
.pagehead h1{margin-bottom:var(--s1)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-s);font-weight:600;text-decoration:none;min-height:44px;margin:-8px 0 -6px}
.back svg{width:18px;height:18px}

/* Kopfzeile */
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--s2) + env(safe-area-inset-top)) var(--s4) var(--s2);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.brand svg{width:20px;height:20px;color:var(--heather)}
#sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--muted);padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);white-space:nowrap;text-decoration:none}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
#sync[data-s=error]::before{background:var(--late)}
#sync[data-s=off],#sync[data-s=ok],#sync[data-s=busy]{display:none}

/* Hero mit Landschaft */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--surface);box-shadow:var(--sh-2)}
.hero svg.scene{display:block;width:100%;height:auto}
.hero svg.scene.short{height:150px}
.hero .body{padding:var(--s4) var(--s5) var(--s5)}
.hero .count{display:flex;align-items:flex-end;gap:var(--s3);margin:-6px 0 var(--s1)}
.hero .count b{font-family:var(--serif);font-size:var(--fs-display);font-weight:600;line-height:.9;letter-spacing:-.03em;color:var(--loch);font-variant-numeric:lining-nums}
.hero .count span{font-family:var(--serif);font-size:24px;line-height:1.1;padding-bottom:4px}
.hero h1{margin-bottom:var(--s2)}

/* Karten */
.card{background:var(--surface);border-radius:var(--r-m);padding:var(--s4) var(--s5);box-shadow:var(--sh-1)}
.card.tip{background:var(--ember-soft);box-shadow:none;display:grid;grid-template-columns:28px 1fr;gap:var(--s3)}
.card.tip > svg{width:24px;height:24px;color:var(--ember);margin-top:1px}
.card.tip p{font-size:var(--fs-s);margin:0}
.card.tip p + p{margin-top:var(--s2)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}
.sechead h2{margin:0}
.sechead a{font-size:var(--fs-s);font-weight:600;text-decoration:none;white-space:nowrap}
.group-title{font-family:var(--serif);font-size:var(--fs-2);margin:var(--s3) 2px calc(-1 * var(--s2))}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:46px;padding:10px 18px;border-radius:var(--r-pill);border:0;background:var(--loch);color:var(--on-loch);font:inherit;font-size:var(--fs-s);font-weight:650;text-decoration:none;cursor:pointer;box-shadow:var(--sh-btn);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:var(--loch-soft);color:var(--loch);box-shadow:none}
.btn.sm{min-height:44px;padding:6px 16px;font-size:var(--fs-xs)}
.btn.wide{width:100%}
.btn.go{width:100%;min-height:62px;font-size:18px;border-radius:var(--r-m);justify-content:flex-start;padding:10px 18px;text-align:left}
.btn.go small{display:block;font-size:var(--fs-xs);font-weight:500;opacity:.85}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:550;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.friend{background:var(--heather-soft);color:var(--heather)}
.chip.sun{background:var(--ember-soft);color:var(--ember)}
.chip.ok{background:var(--moss-soft);color:var(--moss)}

/* Zeitleiste */
ol.stops{list-style:none;margin:0;padding:0}
ol.stops li{position:relative;padding:0 0 var(--s4) 30px}
ol.stops li::before{content:"";position:absolute;left:4px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--loch);z-index:1}
ol.stops li::after{content:"";position:absolute;left:9.5px;top:20px;bottom:-4px;width:2px;background:var(--line)}
ol.stops li:last-child{padding-bottom:0}
ol.stops li:last-child::after{display:none}
ol.stops li.done::before{background:var(--moss);border-color:var(--moss)}
ol.stops li.done::after{background:var(--moss);opacity:.45}
ol.stops li.done .stop{opacity:.6}
ol.stops li.now::before{left:0;top:10px;width:20px;height:20px;background:var(--ember);border:4px solid var(--ember-soft)}
ol.stops li.now .stop{background:var(--ember-soft)}
.stop{display:grid;grid-template-columns:1fr 24px;gap:var(--s2);align-items:center;margin:-6px -10px 0;padding:6px 10px 8px;border-radius:var(--r-s);text-decoration:none;color:inherit;min-height:44px}
a.stop:active{background:var(--surface-2)}
.stop .time{display:block;font-size:var(--fs-xs);font-weight:650;color:var(--loch);font-variant-numeric:tabular-nums;letter-spacing:.02em}
li.now .time{color:var(--ember)}
.stop b{display:block;font-size:var(--fs-body);font-weight:600;line-height:1.3}
.stop .addr{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.stop > svg{width:22px;height:22px;color:var(--loch);opacity:.75}

/* Tagesliste */
.days{display:flex;flex-direction:column;gap:var(--s2)}
details.day{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden;scroll-margin-top:64px}
details.day summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr 16px;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4) var(--s3) var(--s3)}
details.day summary::-webkit-details-marker{display:none}
details.day .inner{padding:var(--s2) var(--s4) var(--s4)}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;height:56px;border-radius:var(--r-s);background:var(--surface-2);line-height:1}
.date b{font-family:var(--serif);font-size:24px;font-weight:600}
.date i{font-style:normal;font-size:var(--fs-2xs);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.daynum{font-size:var(--fs-xs);font-weight:650;color:var(--muted)}
details.day h3{font-size:17px;margin:1px 0 6px}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
details.day[open] .chev{transform:rotate(90deg)}
details.day.past summary{opacity:.62}
details.day.past .date{background:var(--moss-soft);color:var(--moss)}
details.day.today{box-shadow:0 0 0 2px var(--ember),var(--sh-2)}
details.day.today .date{background:var(--ember);color:var(--on-loch)}
details.day.today .date i{color:inherit;opacity:.85}
ul.tips{list-style:none;margin:var(--s4) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
ul.tips li{font-size:var(--fs-s);background:var(--ember-soft);border-radius:var(--r-s);padding:var(--s2) var(--s3)}
.night{display:flex;align-items:center;gap:6px;margin-top:var(--s3);font-size:var(--fs-s);color:var(--muted)}
.night svg{width:18px;height:18px}

/* Aufklappbar */
details.more{margin-top:var(--s3)}
details.more > summary{list-style:none;cursor:pointer;color:var(--loch);font-weight:600;font-size:var(--fs-s);min-height:44px;display:flex;align-items:center;gap:6px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.more[open] > summary::after{transform:rotate(-135deg) translate(-2px,0)}

/* Eingaben */
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;width:100%}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--loch)}
textarea{resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3);margin-top:var(--s3)}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);color:var(--muted);font-weight:550}

/* Checkbox-Liste */
ul.todo{list-style:none;margin:0;padding:0}
ul.todo li{display:flex;align-items:center;border-top:1px solid var(--line)}
ul.todo li:first-child{border-top:0}
ul.todo label{flex:1;display:grid;grid-template-columns:28px 1fr;gap:var(--s3);align-items:center;padding:var(--s3) 0;cursor:pointer;min-height:52px}
ul.todo input{appearance:none;-webkit-appearance:none;margin:0;padding:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
ul.todo input::after{content:"";width:12px;height:7px;border:solid var(--on-loch);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
ul.todo input:checked{background:var(--moss);border-color:var(--moss)}
ul.todo input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
ul.todo input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.due{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--late);font-weight:700}
.x{border:0;background:transparent;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.x.armed{color:var(--late);font-size:var(--fs-xs);font-weight:700}
form.add{display:flex;gap:var(--s2);margin-top:var(--s3)}
form.add input{flex:1}

/* Zeilen mit Pfeil */
ul.rows{list-style:none;margin:0;padding:0}
ul.rows li + li{border-top:1px solid var(--line)}
.rowlink{display:grid;grid-template-columns:auto 1fr auto 16px;gap:var(--s3);align-items:center;min-height:54px;padding:var(--s2) 0;text-decoration:none;color:inherit;width:100%;background:none;border:0;font:inherit;text-align:left;cursor:pointer}
.rowlink .ic{width:36px;height:36px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--loch-soft);color:var(--loch)}
.rowlink .ic svg{width:20px;height:20px}
.rowlink .ic.h{background:var(--heather-soft);color:var(--heather)}
.rowlink .ic.m{background:var(--moss-soft);color:var(--moss)}
.rowlink .ic.e{background:var(--ember-soft);color:var(--ember)}
.rowlink small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.rowlink .chev{width:16px;height:16px}
.rowlink.noic{grid-template-columns:1fr auto 16px}

/* Fortschritt */
.progs{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.prog{display:flex;flex-direction:column;gap:6px;padding:var(--s3);border-radius:var(--r-s);background:var(--surface-2);text-decoration:none;color:inherit}
.prog span{font-size:var(--fs-xs);color:var(--muted);font-weight:550}
.prog b{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1}
.prog b small{font-family:var(--font);font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.prog i{height:6px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--moss) var(--p),var(--line) var(--p))}
.bar{height:8px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--moss) var(--p),var(--line) var(--p));margin-top:var(--s2)}

/* Postkarten */
.cards-x{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * var(--s4));padding:2px var(--s4) var(--s3);scrollbar-width:none}
.cards-x::-webkit-scrollbar{display:none}
.post{flex:none;width:150px;scroll-snap-align:start;background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden;text-decoration:none;color:inherit}
.post svg{display:block;width:100%;height:84px}
.post div{padding:var(--s2) var(--s3) var(--s3)}
.post b{display:block;font-size:var(--fs-s);line-height:1.25}
.post span{font-size:var(--fs-xs);color:var(--muted)}

/* Auswahl (Geld, Status, Karten-App) */
.pick{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pick label,.pick button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);font:inherit;font-size:var(--fs-s);font-weight:600;cursor:pointer;border:0;user-select:none}
.pick input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.pick label:has(input:checked),.pick button.on{background:var(--loch);color:var(--on-loch)}
.pick label:has(input:focus-visible){outline:3px solid var(--heather);outline-offset:2px}
.pick.two label,.pick.two button{flex:1}
.pick.full button{flex:1;padding:8px 6px;font-size:var(--fs-xs)}
.amount{display:flex;align-items:center;gap:var(--s2);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-m);padding:4px var(--s4)}
.amount:focus-within{border-color:var(--loch)}
.amount input{border:0;background:transparent;font-family:var(--serif);font-size:40px;font-weight:600;padding:6px 0;min-width:0}
.amount input:focus{outline:none}
.amount .pick{flex-wrap:nowrap;gap:6px}
.amount .pick label{min-width:44px;padding:8px 12px}
.formstack{display:flex;flex-direction:column;gap:var(--s4)}
.formstack .lbl{font-size:var(--fs-xs);font-weight:650;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.saved{color:var(--moss);font-weight:650;font-size:var(--fs-s);text-align:center;min-height:1.4em;margin:0}

/* Geld */
.balance{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin:0 0 var(--s2)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.who div{background:var(--surface-2);border-radius:var(--r-s);padding:var(--s3)}
.who span{display:block;font-size:var(--fs-xs);color:var(--muted)}
.who b{font-family:var(--serif);font-size:20px}
ul.exp{list-style:none;padding:0;margin:0}
ul.exp li{display:grid;grid-template-columns:1fr auto auto;gap:var(--s2);align-items:center;border-top:1px solid var(--line);padding:var(--s2) 0;min-height:52px}
ul.exp li:first-child{border-top:0}
ul.exp small{display:block;color:var(--muted);font-size:var(--fs-xs)}
ul.exp b{font-variant-numeric:tabular-nums}

/* Tabelle, Notfall, Statistik */
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-s)}
td{padding:var(--s2) var(--s2) var(--s2) 0;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--muted);font-size:var(--fs-xs)}
td.num{white-space:nowrap;text-align:right;padding-right:0}
tr.sum td{font-weight:700;border-bottom:0}
.tel{display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:center;min-height:52px;text-decoration:none;color:inherit}
.tel b{font-family:var(--serif);font-size:26px;color:var(--late);min-width:64px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3)}
.stats div{background:var(--surface-2);border-radius:var(--r-s);padding:var(--s3);text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.stats span{font-size:var(--fs-xs);color:var(--muted)}
.diary p{margin:0 0 var(--s3)}
.diary b{display:block;font-size:var(--fs-xs);color:var(--ember);letter-spacing:.06em;text-transform:uppercase}
.ok-line{display:flex;align-items:center;gap:var(--s2);font-weight:600}
.ok-line::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.ok-line[data-s=ok]::before{background:var(--moss)}
.ok-line[data-s=error]::before{background:var(--late)}
.book .bhead{display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline;margin-bottom:var(--s1)}
.book[data-st=gebucht],.book[data-st=bezahlt]{box-shadow:inset 4px 0 0 var(--moss),var(--sh-1)}
.book[data-st=entfällt]{opacity:.6}
.book .pick{margin-top:var(--s3)}

/* Karte */
.mapbox{padding:var(--s2);scroll-margin-top:64px}
.mapbox svg{display:block;width:100%;height:auto;font-family:var(--font)}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;padding:2px 12px;box-sizing:content-box;border-radius:var(--r-pill)}
nav.tabs a.on{color:var(--loch)}
nav.tabs a.on svg{background:var(--loch-soft)}

@media print{nav.tabs,header.top,textarea,.row,form{display:none}}
</style>
</head>
